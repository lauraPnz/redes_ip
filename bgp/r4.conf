log stderr all;
router id 4.4.4.4;

protocol device {}

protocol direct {
    ipv4;
    interface "lan", "eth_*";
}

protocol kernel {
    ipv4 {
        export all;
    };
}

protocol bgp ibgp_r2 {
    local 10.0.24.2 as 200;
    neighbor 10.0.24.1 as 200;
    ipv4 {
        next hop self;
        import all;
        export all;
    };
}

protocol bgp ebgp_r3 {
    local 10.0.34.2 as 200;
    neighbor 10.0.34.1 as 100;
    ipv4 {
        next hop self;
        import all;
        export all;
    };
}

protocol bgp ebgp_r5 {
    local 10.0.45.1 as 200;
    neighbor 10.0.45.2 as 300;
    ipv4 {
        next hop self;
        import all;
        export all;
    };
}
